<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <button onclick="console.log(cartQty)">show qty</button>

    <button onclick="console.log(cartQty++)">Add to cart</button>

    <button onclick="console.log(cartQty += 2)">+2</button>

    <button onclick="console.log(cartQty +=3)">+3</button>

    <button onclick="console.log(cartQty +=4)">+4</button>

    <button onclick="console.log(cartQty +=5)">+5</button>

    <button onclick="console.log(cartQty--)">remove from cart</button>

    <button onclick="console.log(cartQty -= 2)">-2</button>
    
    <button onclick="console.log(cartQty -= 3)">-3</button>

    <button onclick="console.log(cartQty = 0)">reset cart</button>
    
    <script>
      let cartQty = 0;
    </script>
  </body>
</html>
