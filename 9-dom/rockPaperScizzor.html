<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button onclick="playGame('rock')">rock</button>
    <button onclick="playGame('paper')">paper</button>
    <button onclick="playGame('scissor')">scissor</button>
    <p class="js-result-text"></p>
    <p class="js-choices-text"></p>
    <p class="js-score-text"></p>
    <p>
      <button
        onclick="
      score.wins = 0;
      score.losses = 0;
      score.tie = 0;
      localStorage.removeItem('score');
      updateScore();"
      >
        reset
      </button>
    </p>
  </body>

  <script>
    const resultElement = document.querySelector(".js-result-text");
    const choicesElement = document.querySelector(".js-choices-text");
    const scoreElement = document.querySelector(".js-score-text");

    let score = JSON.parse(localStorage.getItem("score")) || {
      wins: 0,
      losses: 0,
      tie: 0,
    };

    function playGame(userChoice) {
      let computerMove = updateComputerChoice();
      let result = "";

      if (userChoice === "rock") {
        if (computerMove === "rock") {
          result = "tie";
        } else if (computerMove === "paper") {
          result = "you lose";
        } else if (computerMove === "scissor") {
          result = "you win";
        }
      } else if (userChoice === "paper") {
        if (computerMove === "rock") {
          result = "you win";
        } else if (computerMove === "paper") {
          result = "tie";
        } else if (computerMove === "scissor") {
          result = "you lose";
        }
      } else if (userChoice === "scissor") {
        if (computerMove === "rock") {
          result = "you lose";
        } else if (computerMove === "paper") {
          result = "you win";
        } else if (computerMove === "scissor") {
          result = "tie";
        }
      }

      if (result === "you win") {
        score.wins++;
      } else if (result === "you lose") {
        score.losses++;
      } else {
        score.tie++;
      }

      console.log(
        `${result}, your choice ${userChoice}, computer choice ${computerMove}`
      );
      console.log(`wins ${score.wins}, loss ${score.losses}, tie ${score.tie}`);

      localStorage.setItem("score", JSON.stringify(score));
      
      updateScore();
      
      resultElement.innerHTML = `${result}`;
      choicesElement.innerHTML = `your choice ${userChoice}, computer choice ${computerMove}`;
    }

    function updateScore() {
      scoreElement.innerHTML = `wins ${score.wins}, loss ${score.losses}, tie ${score.tie}`;
    }

    function updateComputerChoice() {
      let randomNum = Math.random();
      let computerMove = "";

      if (randomNum >= 0 && randomNum < 1 / 3) {
        computerMove = "rock";
      } else if (randomNum >= 1 / 3 && randomNum < 2 / 3) {
        computerMove = "paper";
      } else if (randomNum >= 2 / 3 && randomNum < 3) {
        computerMove = "scissor";
      }

      return computerMove;
    }
  </script>
</html>
