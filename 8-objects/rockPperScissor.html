    function playGame(playerMove) {
      let computerMove = updateComputerChoice();
      let result = '';

      if (playerMove === 'rock') {
        if (computerMove === 'rock') {
          result = 'tie';
        } else if (computerMove === 'paper') {
          result = 'you lose';
        } else if (computerMove === 'scissor') {
          result = 'you win';
        }
      } else if (playerMove === 'paper') {
        if (computerMove === 'rock') {
          result = 'you win';
        } else if (computerMove === 'paper') {
          result = 'tie';
        } else if (computerMove === 'scissor') {
          result = 'you lose';
        }
      } else if (playerMove === 'scissor') {
        if (computerMove === 'rock') {
          result = 'you lose';
        } else if (computerMove === 'paper') {
          result = 'you win';
        } else if (computerMove === 'scissor') {
          result = 'tie';
        }
      }

      if (result === 'you win') {
        score.wins += 1
      } else if (result === 'you lose') {
        score.losses += 1 
      } else if (result === 'tie') {
        score.tie += 1
      }
      
      localStorage.setItem('score', JSON.stringify(score))

      alert(` ${result}, your move ${playerMove}, computer move ${computerMove}
    wins: ${score.wins}, Losses: ${score.losses}, tie: ${score.tie}`);
    }

    function updateComputerChoice() {
      const randomNum = Math.random();
      let computerMove = '';
      if (randomNum >= 0 && randomNum < 1 / 3) {
        computerMove = 'rock';
      } else if (randomNum >= 1 / 3 && randomNum < 2 / 3) {
        computerMove = 'paper';
      } else if (randomNum >= 2 / 3 && randomNum < 3) {
        computerMove = 'scissor';
      }
      return computerMove;
    }
