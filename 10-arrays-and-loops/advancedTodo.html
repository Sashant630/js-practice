<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>Todo List</p>

    <input type="text" name="" id="" class="js-input" />
    <button onclick="updateTodoList()">Add</button>

    <div class="js-todo-display"></div>

    <script>
      let todoList = ["oto"];

      renderTodo();

      function renderTodo() {
        let todoListItem = ''
        for (let i = 0; i < todoList.length; i++) {
          console.log(todoList[i]);
          const todo = todoList[i];
          const html = `
          <p>
            ${todo}
            <button onclick='todoList.splice(${i}, 1);
            renderTodo();'>delete</button>
          </p>`;
          console.log(html)
          todoListItem += html;
        }

        let displayTodo = document.querySelector(".js-todo-display");
        displayTodo.innerHTML = todoListItem;
      }

      // function deleteTodo() {
      //   const deleteTodo = document.querySelector(".js-delete-todo");
      //   todoListItem.pop();
      // }

      function updateTodoList() {
        const inputElem = document.querySelector(".js-input");
        let name = inputElem.value;

        todoList.push(name);
        console.log(todoList);
        renderTodo();
        inputElem.value = "";
      }
    </script>
  </body>
</html>
