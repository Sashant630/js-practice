<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <button onclick="cartQty > 10 ? alert('cart is full') : console.log(cartQty)">show qty</button>

    <button onclick="cartQty + 1 > 10 ? alert('cart is full' + ' ' + cartQty) : console.log(++cartQty)">Add to cart</button>

    <button onclick="cartQty+2 > 10 ? alert('cart is full' + ' ' + cartQty) :console.log(cartQty += 2)">+2</button>

    <button onclick="cartQty+3 > 10 ? alert('cart is full' + ' ' + cartQty) :console.log(cartQty +=3)">+3</button>

    <button onclick="cartQty+4 > 10 ? alert('cart is full' + ' ' + cartQty) :console.log(cartQty +=4)">+4</button>

    <button onclick="cartQty+5 > 10 ? alert('cart is full' + ' ' + cartQty) :console.log(cartQty +=5)">+5</button>

    <button onclick="cartQty - 1 < 0 ? alert('cart is full' + ' ' + cartQty) :console.log(--cartQty)">remove from cart</button>

    <button onclick="cartQty - 2 < 0 ? alert('cart is full' + ' ' + cartQty) :console.log(cartQty -= 2)">-2</button>
    
    <button onclick="cartQty - 3 < 0 ? alert('cart is full' + ' ' + cartQty) :console.log(cartQty -= 3)">-3</button>

    <button onclick="console.log(cartQty = 0)">reset cart</button>
    
    <script>
      let cartQty = 5;
    </script>
  </body>
</html>
